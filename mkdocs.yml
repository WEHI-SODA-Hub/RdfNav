site_name: RdfNav API Documentation
site_url: https://WEHI-SODA-Hub.github.io/RdfNav/
docs_dir: docs
repo_url: https://github.com/WEHI-SODA-Hub/RdfNav
repo_name: WEHI-SODA-Hub/RdfNav
nav:
  - Home: index.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: google
            show_signature_annotations: true
            show_docstring_attributes: true
            heading_level: 2
            show_root_heading: true
            extensions:
              - griffe_fieldz:
                  add_fields_to: docstring-attributes

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
