[project]
name = "rdfnav"
version = "0.1.0"
description = " Utilities for navigating an RDF graph in Python"
readme = "README.md"
authors = [
    { name = "Michael Milton", email = "michael.r.milton@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rdflib>=7.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "griffe-fieldz>=0.3.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.21",
    "mkdocstrings[python]>=0.30.1",
    "pyright>=1.1.403",
    "pytest>=8.4.0",
]
